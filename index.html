<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c1015">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>紙断面カウンター ライブ</title>
<style>
/* Layout: full-screen viewfinder, guide frame in the middle, readout panel pinned to the bottom */
:root{
  --bg:#0c1015; --panel:rgba(12,16,21,.86); --ink:#eef2f6; --muted:#9daab7; --rule:rgba(255,255,255,.14);
  --accent:#4f7dff; --ok:#3ddc84; --wait:#facc15; --warn:#fb923c; --chip:rgba(255,255,255,.1);
  --f-ui:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:ui-monospace,"SFMono-Regular",Menlo,"Roboto Mono",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;overflow:hidden;background:#000}
#video,#still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#overlay{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.topbar{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));
  background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0))}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;padding:7px 12px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#0c1015;font-weight:700}
.tools{display:flex;gap:6px}
.chipbtn{border:1px solid var(--rule);background:var(--chip);color:var(--ink);font:inherit;font-size:13px;padding:7px 11px;border-radius:10px;cursor:pointer}
.chipbtn[aria-pressed="true"]{border-color:var(--wait);color:var(--wait)}
.panel{position:fixed;left:0;right:0;bottom:0;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--rule);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px));display:grid;gap:8px}
.readout{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.count{font-family:var(--f-num);font-weight:700;font-size:54px;line-height:1;font-variant-numeric:tabular-nums;transition:color .2s}
.count.wait{color:var(--muted)}
.unit{font-size:18px;color:var(--muted)}
.status{margin-left:auto;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.status.ok{background:rgba(61,220,132,.16);color:var(--ok)}
.status.wait{background:rgba(250,204,21,.14);color:var(--wait)}
.status.warn{background:rgba(251,146,60,.16);color:var(--warn)}
.detail{margin:0;font-size:13px;color:var(--muted);min-height:1.4em;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--rule);
  background:var(--chip);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;flex:2 1 auto}
.btn:focus-visible,.seg button:focus-visible,.chipbtn:focus-visible{outline:2px solid var(--wait);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);
  padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px))}
.start .box{max-width:420px;display:grid;gap:14px}
.start h1{margin:0;font-size:24px}
.start p{margin:0;color:var(--muted);line-height:1.7}
.start ol{margin:0;padding-left:1.3em;color:var(--muted);line-height:1.8;font-size:14px}
.start .err{color:var(--warn);font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="still" hidden></canvas>
  <canvas id="overlay"></canvas>
</div>

<header class="topbar" id="topbar">
  <div class="seg" id="matSeg"><button type="button" data-mat="chip">合紙</button><button type="button" data-mat="corr">段ボール</button></div>
  <div class="tools">
    <button type="button" class="chipbtn" id="torchBtn" aria-pressed="false" hidden>ライト</button>
    <button type="button" class="chipbtn" id="resBtn" aria-pressed="false">4K</button>
  </div>
</header>

<section class="panel" id="panel" aria-live="polite">
  <div class="readout"><span id="count" class="count wait">—</span><span class="unit">枚</span><span id="status" class="status">準備中</span></div>
  <p id="detail" class="detail"></p>
  <div class="actions">
    <button type="button" class="btn primary" id="freezeBtn">止めて確認</button>
    <label class="btn" for="photo">写真で試す</label><input id="photo" class="vh" type="file" accept="image/*">
    <button type="button" class="btn" id="sampleBtn">サンプル</button>
  </div>
</section>

<div class="start" id="start">
  <div class="box">
    <h1>紙断面カウンター</h1>
    <p>積み重ねた紙の断面にカメラを向けると、枠の中の紙の塊を見つけて枚数を表示します。</p>
    <ol>
      <li>紙が<strong>横向き</strong>になるように構えます。</li>
      <li>紙の塊の<strong>上端と下端が両方</strong>枠に入るようにします。</li>
      <li>表示が「確定」になったら、その枚数を読みます。</li>
    </ol>
    <button type="button" class="btn primary" id="startBtn">カメラを起動</button>
    <button type="button" class="btn" id="startSample">カメラなしでサンプルを見る</button>
    <p class="err" id="startErr" hidden></p>
  </div>
</div>

<script id="core">
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeSample(kind){
  const W=720,H=960,R=rng(kind==='corr'?7:3);
  const N=kind==='corr'?18:34, top=kind==='corr'?100:90, total=kind==='corr'?760:780;
  let th=[];for(let i=0;i<N;i++)th.push(1+0.1*(R()-0.5));
  const s=th.reduce((a,b)=>a+b,0);th=th.map(v=>v*total/s);
  const B=[top];for(let i=0;i<N;i++)B.push(B[i]+th[i]);
  const xl=[],xr=[],ph=[],pc=[];
  for(let i=0;i<N;i++){xl.push(50+R()*8);xr.push(662+R()*8);ph.push(R()*6.28);pc.push(Math.floor(R()*3)+3*Math.floor(R()*96));}
  const prints=[[236,236,232],[196,44,52],[34,54,112]];
  const wave=x=>3*Math.sin(x/150+0.4)+(x-360)*0.01;
  const data=new Uint8ClampedArray(W*H*4);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const yy=y-wave(x);let r,g,b;
    const L=0.72+0.38*x/W-0.14*y/H,n=(R()-0.5)*20;let k=-1;
    if(yy>=B[0]&&yy<B[N]){let lo=0,hi=N-1;while(lo<hi){const m=(lo+hi+1)>>1;if(B[m]<=yy)lo=m;else hi=m-1;}k=lo;}
    if(k<0||x<xl[k]||x>xr[k]){const v=58+8*Math.sin(x/9+y/40);r=v+12;g=v+4;b=v-4;}
    else{const u=yy-B[k],t=th[k];
      if(kind==='corr'){
        if(u<1.3){r=g=b=38;}else if(u<3.6||u>t-2.4){r=196;g=156;b=104;}
        else{const P=t*1.45,c=t/2+(t/2-4.2)*Math.sin(2*Math.PI*x/P+ph[k]);
          if(Math.abs(u-c)<1.5){r=176;g=134;b=88;}else{const dd=Math.min(1,Math.abs(u-c)/6);r=70-20*dd;g=54-16*dd;b=38-12*dd;}}
      }else{
        if(u<1.3){r=g=b=36;}
        else if(u<3.6){const p=((x+Math.floor(pc[k]/3))%96)<34?prints[pc[k]%3]:prints[0];r=p[0];g=p[1];b=p[2];}
        else if(u>t-2.4){r=228;g=228;b=224;}
        else{const f=8*Math.sin(x*0.9+u*2.1+k);r=148+f;g=145+f;b=138+f;}
      }}
    const i=(y*W+x)*4;data[i]=r*L+n;data[i+1]=g*L+n;data[i+2]=b*L+n;data[i+3]=255;
  }
  return {w:W,h:H,data,truth:N};
}
function toGray(data,w,h){const g=new Float32Array(w*h);for(let i=0,j=0;i<g.length;i++,j+=4)g[i]=0.299*data[j]+0.587*data[j+1]+0.114*data[j+2];return g;}
function movAvg(a,win){const n=a.length,h=win>>1,p=new Float64Array(n+1);for(let i=0;i<n;i++)p[i+1]=p[i]+a[i];
  const o=new Float32Array(n);for(let i=0;i<n;i++){const lo=Math.max(0,i-h),hi=Math.min(n,i+h+1);o[i]=(p[hi]-p[lo])/(hi-lo);}return o;}
function detrend(a,win){const m=movAvg(a,win),o=new Float32Array(a.length);for(let i=0;i<a.length;i++)o[i]=a[i]-m[i];return o;}
function gauss(a,sig){if(sig<0.5)return Float32Array.from(a);const r=Math.ceil(sig*3),k=[];let ks=0;for(let i=-r;i<=r;i++){const v=Math.exp(-i*i/(2*sig*sig));k.push(v);ks+=v;}
  const n=a.length,o=new Float32Array(n);for(let i=0;i<n;i++){let s=0;for(let j=-r;j<=r;j++){const x=Math.min(n-1,Math.max(0,i+j));s+=a[x]*k[j+r];}o[i]=s/ks;}return o;}
const odd=v=>{v=Math.max(3,Math.round(v));return v%2?v:v+1;};

/* 縦方向のプロファイルを帯ごとに作る（紙は横向き＝行方向に平均） */
function bandProfiles(gray,w,h,nb,frac){
  const out=[],hw=Math.max(1,Math.round(w*frac/2));
  for(let b=0;b<nb;b++){const cx=Math.round((b+0.5)/nb*w),x0=Math.max(0,cx-hw),x1=Math.min(w,cx+hw),p=new Float32Array(h);
    for(let y=0;y<h;y++){let s=0;const r=y*w;for(let x=x0;x<x1;x++)s+=gray[r+x];p[y]=s/(x1-x0);}
    out.push({x:cx/w,prof:p});}
  return out;
}
function prepSig(prof,target){const n=prof.length,s=new Float32Array(n),inv=target!=='gapLight';for(let i=0;i<n;i++)s[i]=inv?-prof[i]:prof[i];return s;}
function estimatePitch(sig,target){
  const n=sig.length;if(n<40)return null;
  const d0=detrend(sig,target==='body'?odd(Math.max(9,n/6)):odd(15)),ab=Array.from(d0,Math.abs).sort((a,b)=>a-b),cl=3*(ab[ab.length>>1]||1),d=gauss(d0.map(v=>Math.max(-cl,Math.min(cl,v))),2);
  const maxL=Math.floor(n/2.2),r=new Float32Array(maxL+3);
  for(let L=3;L<=maxL;L++){let s=0,a=0,b=0;for(let i=0;i+L<n;i++){s+=d[i]*d[i+L];a+=d[i]*d[i];b+=d[i+L]*d[i+L];}r[L]=a&&b?s/Math.sqrt(a*b):0;}
  const peaks=[];for(let L=4;L<maxL&&L<=n/4;L++)if(r[L]>r[L-1]&&r[L]>=r[L+1]&&r[L]>0)peaks.push(L);
  if(!peaks.length)return null;
  const near=L=>{const c=Math.round(L);let m=-1;for(let j=c-2;j<=c+2;j++)if(j>=3&&j<=maxL&&r[j]>m)m=r[j];return m;};
  const score=L=>{let s=0,c=0;for(let k=1;k*L<=maxL&&k<=4;k++){s+=near(k*L);c++;}return s/c;};
  const sc=peaks.map(score),top=Math.max(...sc);if(top<0.05)return null;
  const best=peaks[sc.findIndex(v=>v>=0.5*top)];
  const y0=r[best-1],y1=r[best],y2=r[best+1],den=y0-2*y1+y2;
  return {pitch:best+(den?0.5*(y0-y2)/den:0),corr:r[best]};
}
function detectFeatures(sig,pitch,target,sens){
  const n=sig.length,sm=gauss(sig,Math.max(0.6,pitch*(target==='body'?0.18:0.03))),d2=detrend(sm,odd(pitch*2));
  const pos=[];for(let i=0;i<n;i++)if(d2[i]>0)pos.push(d2[i]);pos.sort((a,b)=>a-b);
  const thr=sens*(pos.length?pos[Math.floor(pos.length*0.9)]:0);
  const cand=[];for(let i=1;i<n-1;i++)if(d2[i]>d2[i-1]&&d2[i]>=d2[i+1]&&d2[i]>thr)cand.push(i);
  cand.sort((a,b)=>d2[b]-d2[a]);const acc=[],minD=pitch*0.55;
  for(const c of cand)if(acc.every(a=>Math.abs(a-c)>=minD))acc.push(c);
  return acc.sort((a,b)=>a-b);
}
function resample(sig,a,b,m){const o=new Float32Array(m),n=sig.length;for(let i=0;i<m;i++){const x=a+(b-a)*(i+0.5)/m,i0=Math.floor(x),f=x-i0;
  const v0=sig[Math.max(0,Math.min(n-1,i0))],v1=sig[Math.max(0,Math.min(n-1,i0+1))];o[i]=v0+(v1-v0)*f;}return o;}
function zn(a){let m=0;for(const v of a)m+=v;m/=a.length;let s=0;for(const v of a)s+=(v-m)*(v-m);s=Math.sqrt(s/a.length)||1;return{z:a.map(v=>(v-m)/s),mean:m};}
function corrZ(a,b){let s=0;for(let i=0;i<a.length;i++)s+=a[i]*b[i];return s/a.length;}

/* 1本の帯で紙の塊を見つけて数える */
function countStack(prof,opt){
  const sig=prepSig(prof,opt.target),n=sig.length;
  const p=opt.pitch||(estimatePitch(sig,opt.target)||{}).pitch;if(!p||p<4)return null;
  const f=detectFeatures(sig,p,opt.target,opt.sens);if(f.length<3)return null;
  let best=null,cur=[f[0]];
  const consider=c=>{if(c.length<2)return;let u=0;for(let i=1;i<c.length;i++)u+=Math.round((c[i]-c[i-1])/p);if(!best||u>best.u)best={pts:c.slice(),u};};
  for(let i=1;i<f.length;i++){const s=f[i]-f[i-1];if(s>=0.6*p&&s<=2.6*p)cur.push(f[i]);else{consider(cur);cur=[f[i]];}}
  consider(cur);if(!best)return null;
  let pts=best.pts;const M=24;
  const tmpl=()=>{const T=new Float32Array(M);let c=0;for(let i=1;i<pts.length;i++){if(Math.round((pts[i]-pts[i-1])/p)!==1)continue;const z=zn(resample(sig,pts[i-1],pts[i],M)).z;for(let j=0;j<M;j++)T[j]+=z[j];c++;}
    if(c<2)return null;for(let j=0;j<M;j++)T[j]/=c;return zn(T).z;};
  let T=tmpl();if(!T)return null;
  const ic=(a,b)=>corrZ(zn(resample(sig,a,b,M)).z,T);
  while(pts.length>3&&ic(pts[0],pts[1])<0.3)pts.shift();
  while(pts.length>3&&ic(pts[pts.length-2],pts[pts.length-1])<0.3)pts.pop();
  T=tmpl();if(!T||pts.length<3)return null;
  let units=0;const flags=[];
  for(let i=1;i<pts.length;i++){const s=pts[i]-pts[i-1],k=Math.max(1,Math.round(s/p));units+=k;if(k>1||Math.abs(s-k*p)>0.35*p)flags.push(i);}
  const means=[];for(let i=1;i<pts.length;i++)means.push(zn(resample(sig,pts[i-1],pts[i],M)).mean);
  const mu=means.reduce((a,b)=>a+b,0)/means.length;let lo=Infinity,hi=-Infinity;for(let i=pts[0];i<=pts[pts.length-1];i++){if(sig[i]<lo)lo=sig[i];if(sig[i]>hi)hi=sig[i];}
  const sd=Math.sqrt(means.reduce((a,b)=>a+(b-mu)*(b-mu),0)/means.length);
  const ext=(a,b)=>{if(a<0||b>n-1)return 0;const z=zn(resample(sig,a,b,M));return corrZ(z.z,T)>0.5&&Math.abs(z.mean-mu)<Math.max(3*sd,0.2*(hi-lo))?1:0;};
  const first=pts[0],last=pts[pts.length-1];let count,top,bot,et=0,eb=0;
  if(opt.target==='body'){count=units+1;top=first-p/2;bot=last+p/2;}
  else{et=ext(first-p,first);eb=ext(last,last+p);count=units+et+eb;top=first-(et?p:0);bot=last+(eb?p:0);}
  return{count,pitch:p,marks:pts,top:Math.max(0,top),bot:Math.min(n-1,bot),flags,n};
}

/* 1フレーム分：複数の帯で数えて多数決 */
function analyzeFrame(gray,w,h,opt){
  const bands=bandProfiles(gray,w,h,5,opt.target==='body'?0.2:0.125);
  let pe=estimatePitch(prepSig(bands[2].prof,opt.target),opt.target);
  if(!pe){const all=bandProfiles(gray,w,h,1,0.9)[0];pe=estimatePitch(prepSig(all.prof,opt.target),opt.target);}
  if(!pe)return{pitch:null,results:[],mode:null,votes:0};
  const results=bands.map(b=>{const r=countStack(b.prof,{...opt,pitch:pe.pitch});return r?{...r,x:b.x}:null;});
  const tally={};for(const r of results)if(r)tally[r.count]=(tally[r.count]||0)+1;
  let mode=null,votes=0;for(const k in tally)if(tally[k]>votes){votes=tally[k];mode=+k;}
  let rep=null;for(const i of[2,1,3,0,4])if(results[i]&&results[i].count===mode){rep=results[i];break;}
  return{pitch:pe.pitch,results,mode,votes,rep};
}
</script>

<script>
(function(){
const $=s=>document.querySelector(s);
const video=$('#video'),still=$('#still'),ov=$('#overlay'),octx=ov.getContext('2d');
const proc=document.createElement('canvas'),pctx=proc.getContext('2d',{willReadFrequently:true});
const PW=160;
const MAT={chip:{target:'gapDark',sens:0.3},corr:{target:'body',sens:0.3}};
const S={material:'chip',source:'none',stream:null,track:null,torch:false,hires:false,frozen:false,
  last:null,crop:null,hist:[],manual:[],removed:[],sampleTruth:null,timer:0};
let guide={x:0,y:0,w:0,h:0};

function opt(){return{...MAT[S.material]};}
function setPressed(){document.querySelectorAll('#matSeg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mat===S.material)));
  $('#resBtn').setAttribute('aria-pressed',String(S.hires));$('#torchBtn').setAttribute('aria-pressed',String(S.torch));
  $('#freezeBtn').textContent=S.frozen?(S.source==='video'?'再開':'カメラに戻る'):'止めて確認';}

/* 画面とソース画像の対応（object-fit: cover） */
function srcSize(){return S.source==='video'?{w:video.videoWidth,h:video.videoHeight}:{w:still.width,h:still.height};}
function fit(){const cw=ov.clientWidth,ch=ov.clientHeight,{w,h}=srcSize();if(!w||!h)return null;
  if(S.source==='still'){const s=Math.min(cw/w,guide.h/h);return{s,ox:(cw-w*s)/2,oy:guide.y+(guide.h-h*s)/2,w,h};}
  const s=Math.max(cw/w,ch/h);return{s,ox:(cw-w*s)/2,oy:(ch-h*s)/2,w,h};}
function layout(){
  const dpr=window.devicePixelRatio||1;ov.width=Math.round(ov.clientWidth*dpr);ov.height=Math.round(ov.clientHeight*dpr);
  const cw=ov.clientWidth,top=$('#topbar').getBoundingClientRect().bottom+8,bottom=$('#panel').getBoundingClientRect().top-12;
  const gw=Math.min(cw*0.62,420);guide={x:(cw-gw)/2,y:top,w:gw,h:Math.max(80,bottom-top)};
  const F=S.source==='still'?fit():null;
  if(F)Object.assign(still.style,{left:F.ox+'px',top:F.oy+'px',width:F.w*F.s+'px',height:F.h*F.s+'px',inset:'auto',objectFit:'fill'});
  else still.removeAttribute('style');
}

/* 枠の範囲を切り出し、横は160pxに縮め、縦は解像度を保ったまま処理 */
function grab(src){
  const F=fit();if(!F)return null;
  let sx=(guide.x-F.ox)/F.s,sy=(guide.y-F.oy)/F.s,sw=guide.w/F.s,sh=guide.h/F.s;
  sx=Math.max(0,sx);sy=Math.max(0,sy);sw=Math.min(F.w-sx,sw);sh=Math.min(F.h-sy,sh);if(sw<8||sh<40)return null;
  const ph=Math.min(2400,Math.round(sh));proc.width=PW;proc.height=ph;
  pctx.imageSmoothingEnabled=true;pctx.imageSmoothingQuality='high';pctx.drawImage(src,sx,sy,sw,sh,0,0,PW,ph);
  const id=pctx.getImageData(0,0,PW,ph);
  return{gray:toGray(id.data,PW,ph),w:PW,h:ph,crop:{sx,sy,sw,sh,ph},F};
}

function process(src){
  const g=grab(src);if(!g){S.last=null;return;}
  const a=analyzeFrame(g.gray,g.w,g.h,opt());a.crop=g.crop;S.last=a;S.crop=g.crop;
}

function loop(){
  S.timer=0;if(S.source!=='video'||S.frozen)return;
  if(video.readyState>=2){const t0=performance.now();process(video);
    S.hist.push(S.last&&S.last.mode&&!edgeCut(S.last)?S.last.mode:null);if(S.hist.length>10)S.hist.shift();
    render();const dt=performance.now()-t0;S.timer=setTimeout(loop,Math.max(60,140-dt));}
  else S.timer=setTimeout(loop,200);
}
function edgeCut(a){const r=a&&a.rep;if(!r)return null;if(r.top<0.4*r.pitch)return'top';if(r.bot>r.n-1-0.4*r.pitch)return'bot';return null;}
function stable(){const h=S.hist.filter(v=>v!=null);if(h.length<6)return null;const t={};for(const v of h)t[v]=(t[v]||0)+1;
  let m=null,c=0;for(const k in t)if(t[k]>c){c=t[k];m=+k;}return c>=7&&S.last&&S.last.votes>=3?m:null;}

/* 表示 */
function render(){draw();readout();}
function readout(){
  const a=S.last,cnt=$('#count'),st=$('#status'),det=$('#detail');
  const setS=(t,c)=>{st.textContent=t;st.className='status'+(c?' '+c:'');};
  if(!a||!a.pitch||!a.mode){cnt.textContent='—';cnt.className='count wait';
    setS(S.source==='none'?'準備中':'探しています','');det.textContent='枠の中に紙の塊を入れてください（紙は横向き）';return;}
  const r=a.rep,p=a.pitch,cut=edgeCut(a);
  let count=a.mode;
  if(S.frozen)count=a.mode+S.manual.length-S.removed.length;
  cnt.textContent=count;
  const flags=r?r.flags.length:0;
  let info='1枚 ≈ '+p.toFixed(1)+'px ・ 5本中'+a.votes+'本が一致'+(flags?' ・ 間隔の乱れ '+flags+'箇所':'');
  if(S.sampleTruth)info+=' ・ サンプルの正解 '+S.sampleTruth+'枚';
  if(S.frozen&&(S.manual.length||S.removed.length))info+=' ・ 手動修正 +'+S.manual.length+' / −'+S.removed.length;
  det.textContent=info;
  if(p<5){cnt.className='count wait';setS('近づいてください','warn');return;}
  if(cut){cnt.className='count wait';setS(cut==='top'?'上端を枠に入れて':'下端を枠に入れて','warn');return;}
  if(S.frozen){cnt.className='count';const good=a.votes>=3&&!flags;
    setS(good?'静止画・タップで修正':'要確認・タップで修正',good?'ok':'warn');return;}
  const sv=stable();
  if(sv!=null){cnt.textContent=sv;cnt.className='count';setS('確定','ok');}
  else{cnt.className='count wait';setS('計測中…','wait');}
}

function draw(){
  const dpr=window.devicePixelRatio||1,cw=ov.clientWidth,ch=ov.clientHeight;
  octx.setTransform(dpr,0,0,dpr,0,0);octx.clearRect(0,0,cw,ch);
  const g=guide;
  octx.fillStyle='rgba(0,0,0,0.45)';octx.beginPath();octx.rect(0,0,cw,ch);octx.rect(g.x,g.y,g.w,g.h);octx.fill('evenodd');
  const a=S.last,ok=!S.frozen&&stable()!=null;
  const col=ok?'#3ddc84':(a&&a.mode&&!edgeCut(a))?'#facc15':'rgba(255,255,255,0.9)';
  octx.strokeStyle=col;octx.lineWidth=3;const L=22;
  for(const [x,y,dx,dy] of [[g.x,g.y,1,1],[g.x+g.w,g.y,-1,1],[g.x,g.y+g.h,1,-1],[g.x+g.w,g.y+g.h,-1,-1]]){
    octx.beginPath();octx.moveTo(x+dx*L,y);octx.lineTo(x,y);octx.lineTo(x,y+dy*L);octx.stroke();}
  if(!a||!a.rep||!S.crop)return;
  const F=fit();if(!F)return;
  const c=S.crop,Y=v=>F.oy+(c.sy+v*c.sh/c.ph)*F.s;
  const r=a.rep;
  octx.lineWidth=2;octx.strokeStyle=col;octx.setLineDash([8,6]);
  for(const v of[r.top,r.bot]){octx.beginPath();octx.moveTo(g.x-10,Y(v));octx.lineTo(g.x+g.w+10,Y(v));octx.stroke();}
  octx.setLineDash([]);
  // 代表の帯に検出位置を描く
  const bx=g.x+r.x*g.w,half=Math.max(10,g.w*(MAT[S.material].target==='body'?0.1:0.0625));
  const flagged=new Set();r.flags.forEach(i=>{flagged.add(i);flagged.add(i-1);});
  const marks=r.marks.map((m,i)=>({y:m,flag:flagged.has(i),manual:false})).filter(m=>!S.removed.some(t=>Math.abs(t-m.y)<0.5))
    .concat(S.manual.map(y=>({y,flag:false,manual:true})));
  marks.sort((p,q)=>p.y-q.y);
  marks.forEach((m,i)=>{const y=Y(m.y);
    octx.strokeStyle='rgba(0,0,0,0.75)';octx.lineWidth=4;octx.beginPath();octx.moveTo(bx-half,y);octx.lineTo(bx+half,y);octx.stroke();
    octx.strokeStyle=m.manual?'#c084fc':m.flag?'#fb923c':'#22d3ee';octx.lineWidth=2;octx.beginPath();octx.moveTo(bx-half,y);octx.lineTo(bx+half,y);octx.stroke();});
  // 10枚ごとの目盛り（境目方式は上から数えた枚数）
  octx.font='700 12px '+getComputedStyle(document.documentElement).getPropertyValue('--f-num');octx.textBaseline='middle';
  const step=r.pitch,start=r.top,isBody=MAT[S.material].target==='body';
  for(let k=10;k<a.mode;k+=10){const v=isBody?start+(k-0.5)*step:start+k*step;if(v>r.bot)break;const y=Y(v),x=g.x+g.w+6;
    octx.lineWidth=3;octx.strokeStyle='rgba(0,0,0,.8)';octx.strokeText(String(k),x,y);octx.fillStyle='#fff';octx.fillText(String(k),x,y);}
}

/* 静止画で修正：タップで追加・削除 */
ov.addEventListener('pointerdown',e=>{
  if(!S.frozen||!S.last||!S.last.rep||!S.crop)return;
  const F=fit();const rect=ov.getBoundingClientRect(),py=e.clientY-rect.top,px=e.clientX-rect.left;
  if(px<guide.x-20||px>guide.x+guide.w+20)return;
  const c=S.crop,v=((py-F.oy)/F.s-c.sy)*c.ph/c.sh,p=S.last.rep.pitch;
  const mi=S.manual.findIndex(t=>Math.abs(t-v)<0.4*p);if(mi>=0){S.manual.splice(mi,1);render();return;}
  const auto=S.last.rep.marks.find(t=>Math.abs(t-v)<0.4*p&&!S.removed.some(x=>Math.abs(x-t)<0.5));
  if(auto!=null)S.removed.push(auto);else S.manual.push(v);
  render();
});

/* カメラ */
async function startCamera(){
  const err=$('#startErr');err.hidden=true;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){err.textContent='このブラウザではカメラを使えません。https:// のページで、Safari または Chrome で開いてください。';err.hidden=false;return;}
  stopCamera();
  try{
    const res=S.hires?{width:{ideal:3840},height:{ideal:2160}}:{width:{ideal:1920},height:{ideal:1080}};
    const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},...res}});
    S.stream=stream;S.track=stream.getVideoTracks()[0];video.srcObject=stream;await video.play().catch(()=>{});
    const caps=S.track.getCapabilities?S.track.getCapabilities():{};$('#torchBtn').hidden=!caps.torch;S.torch=false;
    if(caps.focusMode&&caps.focusMode.includes('continuous'))S.track.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{});
    S.source='video';S.frozen=false;S.sampleTruth=null;S.hist=[];S.manual=[];S.removed=[];
    video.hidden=false;still.hidden=true;$('#start').hidden=true;
    layout();setPressed();clearTimeout(S.timer);loop();
  }catch(e){
    err.textContent=e&&e.name==='NotAllowedError'?'カメラの使用が許可されていません。ブラウザの設定でこのページのカメラを許可してください。':'カメラを起動できませんでした（'+(e&&e.name||'不明なエラー')+'）。';
    err.hidden=false;$('#start').hidden=false;
  }
}
function stopCamera(){if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null;S.track=null;}clearTimeout(S.timer);}

/* 静止画（写真・サンプル・止めたフレーム） */
function showStill(canvas,truth){
  still.width=canvas.width;still.height=canvas.height;still.getContext('2d').drawImage(canvas,0,0);
  still.hidden=false;video.hidden=true;$('#start').hidden=true;
  S.source='still';S.frozen=true;S.sampleTruth=truth||null;S.manual=[];S.removed=[];
  layout();process(still);setPressed();render();
}
function loadSample(){const s=makeSample(S.material),c=document.createElement('canvas');c.width=s.w;c.height=s.h;
  c.getContext('2d').putImageData(new ImageData(s.data,s.w,s.h),0,0);stopCamera();showStill(c,s.truth);}

$('#startBtn').addEventListener('click',startCamera);
$('#startSample').addEventListener('click',loadSample);
$('#sampleBtn').addEventListener('click',loadSample);
$('#photo').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  const url=URL.createObjectURL(f),img=new Image();
  img.onload=()=>{const sc=Math.min(1,3000/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
    c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);stopCamera();showStill(c,null);};
  img.onerror=()=>{URL.revokeObjectURL(url);$('#detail').textContent='画像を読み込めませんでした。JPEGかPNGの写真を選んでください。';};
  img.src=url;});
$('#freezeBtn').addEventListener('click',()=>{
  if(S.source==='video'&&!S.frozen){
    if(video.readyState<2)return;
    const c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;c.getContext('2d').drawImage(video,0,0);
    still.width=c.width;still.height=c.height;still.getContext('2d').drawImage(c,0,0);
    S.frozen=true;S.manual=[];S.removed=[];process(still);setPressed();render();return;}
  if(S.source==='video'&&S.frozen){S.frozen=false;S.hist=[];S.manual=[];S.removed=[];setPressed();loop();return;}
  startCamera();
});
$('#matSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.material=b.dataset.mat;S.hist=[];S.manual=[];S.removed=[];setPressed();
  if(S.sampleTruth){loadSample();return;}
  if(S.frozen&&S.source!=='none'){process(S.source==='video'?still:still);render();}});
$('#resBtn').addEventListener('click',()=>{S.hires=!S.hires;setPressed();if(S.source==='video')startCamera();});
$('#torchBtn').addEventListener('click',()=>{if(!S.track)return;S.torch=!S.torch;S.track.applyConstraints({advanced:[{torch:S.torch}]}).catch(()=>{S.torch=false;});setPressed();});
window.addEventListener('resize',()=>{layout();if(S.frozen&&S.source!=='none')process(still);render();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(S.timer);else if(S.source==='video'&&!S.frozen)loop();});

layout();setPressed();render();
})();
</script>
